name: Model Training & Monitoring CI/CD Pipeline

on:
  push:
    branches: [ "ci-cd-pipeline", "ci-cd-setup", "model-training", "main" ]
  pull_request:
    branches: [ "ci-cd-pipeline", "ci-cd-setup", "model-training", "main" ]

jobs:
  train-and-track:
    name: Train CMAPSS RUL Model & Log Experiments
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install uv Package Manager
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        version: "latest"

    - name: Set up Python Environment
      run: uv python install 3.12

    - name: Install Project & Dependencies
      run: |
        uv sync --all-extras --dev

    - name: Execute Model Training
      env:
        PYTHONPATH: code
      run: |
        uv run python code/src/training/train.py

    - name: Run Tests
      run: |
        uv run pytest || echo "No tests configured, skipping."

    - name: Upload MLflow Runs & Model Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cmapss-training-artifacts
        path: |
          mlruns/
          models/
          *.pkl
          *.pt
          *.h5
        if-no-files-found: ignore
