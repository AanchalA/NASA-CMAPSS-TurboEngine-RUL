name: Test Suite

on:
  push:
    branches:
      - main
      - data-preprocessing
      - model-training
      - model-deployment
      - actions-logging-monitoring
  pull_request:
    branches:
      - main
      - data-preprocessing
      - model-training
      - model-deployment
      - actions-logging-monitoring

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Install uv and Python
      uses: astral-sh/setup-uv@v9.0.0
      with:        
        python-version: "3.12"
        enable-cache: true
        cache-python: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Install Test Dependencies
      run: uv sync --frozen --all-extras --dev

    - name: Run Tests
      env:
        PYTHONPATH: ${{ github.workspace }}/code
      run: uv run --no-sync pytest -m "not requires_data"
