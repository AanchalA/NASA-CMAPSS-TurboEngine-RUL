name: Test Suite

on:
  push:
    branches:
      - main
      - data-preprocessing
      - model-training
      - model-deployment
      - actions-logging-monitoring
  pull_request:
    branches:
      - main
      - data-preprocessing
      - model-training
      - model-deployment
      - actions-logging-monitoring

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install uv Package Manager
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        version: "latest"

    - name: Set up Python Environment
      run: uv python install 3.12

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Install Test Dependencies
      run: uv sync --frozen --all-extras --dev

    - name: Run Tests
      env:
        PYTHONPATH: ${{ github.workspace }}/code
      run: uv run --no-sync pytest -m "not requires_data"
