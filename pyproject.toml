[project]
name = "nasa-c-mapss"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=3.14.0",
    "pandas>=2.2,<3",
    "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
train = [
    "pyarrow",
    "torch>=2.7",
    "xgboost-cpu>=3.0",
]
serve = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "prometheus-client>=0.26.0",
]
offline = [
    "apache-airflow==3.2.2",
    "dvc>=3.67.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",    
    "pyspark>=4.0.1",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
markers = [
    "requires_data: tests requiring the local NASA C-MAPSS dataset",
]
